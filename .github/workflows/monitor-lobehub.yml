name: A - Monitor LobeHub Releases

on:
  push:
    branches: [main]
    paths: ['VERSION']
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read patch version
        id: version
        run: |
          V=$(cat VERSION 2>/dev/null || echo "v0")
          echo "Patch version: $V"
          echo "value=$V" >> "$GITHUB_OUTPUT"

      - name: Fetch latest LobeHub release tag
        id: fetch
        run: |
          LATEST_TAG=$(curl -sL "https://api.github.com/repos/lobehub/lobe-chat/releases/latest" \
            | jq -r '.tag_name // empty')
          if [[ -z "$LATEST_TAG" || "$LATEST_TAG" == "null" ]]; then
            echo "❌ Failed to resolve latest LobeHub tag"
            exit 1
          fi
          echo "Latest LobeHub tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Check if already processed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.fetch.outputs.tag }}"
          PV="${{ steps.version.outputs.value }}"
          RELEASE_TAG="patched-${TAG}-${PV}"
          if gh release view "$RELEASE_TAG" --json name 2>/dev/null; then
            echo "✅ Release $RELEASE_TAG already exists, skipping"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "🆕 New combo: $TAG / $PV, triggering build pipeline"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger B - Apply Patches
        if: steps.check.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "B - Apply Patches" \
            -f lobehub_tag="${{ steps.fetch.outputs.tag }}" \
            -f patch_version="${{ steps.version.outputs.value }}" \
            --ref "${{ github.ref_name }}"
          echo "✅ Triggered B for ${{ steps.fetch.outputs.tag }} / ${{ steps.version.outputs.value }}"
