name: D - Build Docker Image

on:
  workflow_dispatch:
    inputs:
      lobehub_tag:
        description: 'LobeHub tag that was patched (e.g. v1.30.0)'
        required: true
      artifact_run_id:
        description: 'Workflow run ID of B that produced the artifact'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Download patched source artifact
        uses: actions/download-artifact@v4
        with:
          name: patched-source-${{ github.event.inputs.lobehub_tag }}
          run-id: ${{ github.event.inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [[ -n "$GHCR_PAT" ]]; then
            echo "🔑 Using GHCR_PAT secret"
            echo "$GHCR_PAT" | docker login "${{ env.REGISTRY }}" \
              -u "${{ github.actor }}" --password-stdin
          else
            echo "🔑 Using GITHUB_TOKEN (ensure WRITE permission is enabled)"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" \
              -u "${{ github.actor }}" --password-stdin
          fi

      - name: Extract metadata for Docker tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.lobehub_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.lobehub_tag }}
            type=raw,value=latest,enable=true

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
