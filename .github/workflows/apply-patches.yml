name: B - Apply Patches

on:
  workflow_dispatch:
    inputs:
      lobehub_tag:
        description: 'LobeHub tag to patch (e.g. v1.30.0)'
        required: true
      patch_version:
        description: 'Patch version (e.g. v1). Defaults to VERSION file content'
        required: false
        default: ''

env:
  MIN_LOBEHUB_VERSION: 'v2.2.3'

permissions:
  contents: read
  actions: write

jobs:
  patch-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve patch version
        id: patch
        run: |
          PV="${{ github.event.inputs.patch_version }}"
          if [[ -z "$PV" ]]; then
            PV=$(cat VERSION 2>/dev/null || echo "v0")
          fi
          echo "Patch version: $PV"
          echo "value=$PV" >> "$GITHUB_OUTPUT"

      - name: Validate LobeHub tag
        id: resolve
        run: |
          TAG="${{ github.event.inputs.lobehub_tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          MIN="${{ env.MIN_LOBEHUB_VERSION }}"
          TAG_NUM="${TAG#v}"; MIN_NUM="${MIN#v}"
          HIGHEST=$(printf '%s\n' "$TAG_NUM" "$MIN_NUM" | sort -V | tail -1)
          if [ "$HIGHEST" != "$TAG_NUM" ]; then
            echo "❌ LobeHub tag $TAG is lower than minimum supported version $MIN"; exit 1
          fi
          echo "✅ LobeHub tag $TAG meets minimum version $MIN"

      - name: Clone LobeHub at ${{ steps.resolve.outputs.tag }}
        run: |
          git clone --depth 1 --branch "${{ steps.resolve.outputs.tag }}" \
            https://github.com/lobehub/lobe-chat.git lobehub

      - name: Apply patches
        run: |
          bash scripts/apply-patches.sh "$PWD/lobehub"
          echo ""
          echo "=== Verification ==="
          if [ -f lobehub/apps/server/src/modules/S3/index.ts ]; then
            echo "--- S3 module ---"
            grep -c "setCredentialProvider" lobehub/apps/server/src/modules/S3/index.ts
            echo "--- Credential store file ---"
            ls -la lobehub/apps/server/src/patches/
            echo "--- Entry point import ---"
            grep -c "dogecloud-credential-store" lobehub/apps/server/src/hono/standalone.ts || \
              { echo "❌ Import not found in standalone.ts"; exit 1; }
            echo "✓ All checks passed"
          else
            echo "--- S3 module (legacy) ---"
            grep -c "setCredentialProvider" lobehub/src/server/modules/S3/index.ts
            echo "--- Credential store file ---"
            ls -la lobehub/src/server/patches/
            echo "--- Entry point import ---"
            grep -c "dogecloud-credential-store" lobehub/src/server/hono/standalone.ts || \
              { echo "❌ Import not found in standalone.ts"; exit 1; }
            echo "✓ All checks passed"
          fi

      - name: Upload patched source as artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-source-${{ steps.resolve.outputs.tag }}-${{ steps.patch.outputs.value }}
          path: lobehub/
          include-hidden-files: true
          retention-days: 7

      - name: Trigger C - Release Source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "C - Release Source" \
            -f lobehub_tag="${{ steps.resolve.outputs.tag }}" \
            -f patch_version="${{ steps.patch.outputs.value }}" \
            -f artifact_run_id="${{ github.run_id }}" \
            --ref "${{ github.ref_name }}"

      - name: Trigger D - Build Docker Image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "D - Build Docker Image" \
            -f lobehub_tag="${{ steps.resolve.outputs.tag }}" \
            -f patch_version="${{ steps.patch.outputs.value }}" \
            -f artifact_run_id="${{ github.run_id }}" \
            --ref "${{ github.ref_name }}"
