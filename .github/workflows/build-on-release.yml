name: Build patched LobeHub image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      lobehub_tag:
        description: 'LobeHub tag to build (e.g. v1.30.0)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MIN_LOBEHUB_VERSION: 'v2.2.3'

jobs:
  get-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve LobeHub tag
        id: resolve
        run: |
          if [[ -n "${{ github.event.inputs.lobehub_tag }}" ]]; then
            echo "tag=${{ github.event.inputs.lobehub_tag }}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(curl -sL "https://api.github.com/repos/lobehub/lobe-chat/releases/latest" \
              | jq -r '.tag_name // empty')
            if [[ -z "$TAG" || "$TAG" == "null" ]]; then
              echo "❌ Failed to resolve latest LobeHub tag"
              exit 1
            fi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Check minimum version
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          MIN="${{ env.MIN_LOBEHUB_VERSION }}"

          # Strip leading 'v' for comparison
          TAG_NUM="${TAG#v}"
          MIN_NUM="${MIN#v}"

          # Use sort -V for semver comparison
          HIGHEST=$(printf '%s\n' "$TAG_NUM" "$MIN_NUM" | sort -V | tail -1)

          if [ "$HIGHEST" != "$TAG_NUM" ]; then
            echo "❌ LobeHub tag $TAG is lower than minimum supported version $MIN"
            echo "   The current patch requires LobeHub >= $MIN (turborepo structure)."
            echo "   For older versions, checkout an earlier revision of this repository."
            exit 1
          fi

          echo "✅ LobeHub tag $TAG meets minimum version $MIN"

  build:
    needs: [get-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Clone LobeHub at ${{ needs.get-tag.outputs.tag }}
        run: |
          git clone --depth 1 --branch "${{ needs.get-tag.outputs.tag }}" \
            https://github.com/lobehub/lobe-chat.git lobehub
          echo "Cloned lobehub/lobe-chat@${{ needs.get-tag.outputs.tag }}"

      - name: Apply patches
        run: |
          bash scripts/apply-patches.sh "$PWD/lobehub"
          # Verify the patch files are in place (supports both old and new structure)
          echo "=== Verification ==="
          if [ -f lobehub/apps/server/src/modules/S3/index.ts ]; then
            echo "--- S3 module (v2.2+ structure) ---"
            grep -c "setCredentialProvider" lobehub/apps/server/src/modules/S3/index.ts
            echo "--- Credential store ---"
            ls -la lobehub/apps/server/src/patches/
          else
            echo "--- S3 module (legacy structure) ---"
            grep -c "setCredentialProvider" lobehub/src/server/modules/S3/index.ts
            echo "--- Credential store ---"
            ls -la lobehub/src/server/patches/
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [[ -n "$GHCR_PAT" ]]; then
            echo "🔑 Using GHCR_PAT secret (recommended)"
            echo "$GHCR_PAT" | docker login "${{ env.REGISTRY }}" \
              -u "${{ github.actor }}" --password-stdin
          else
            echo "🔑 Using GITHUB_TOKEN (ensure WRITE permission is enabled)"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" \
              -u "${{ github.actor }}" --password-stdin
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.get-tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.get-tag.outputs.tag }}
            type=raw,value=latest,enable=true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./lobehub
          file: ./lobehub/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
